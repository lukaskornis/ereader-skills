[package]
name = "claudechat"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls"] }
serde_json = "1"
base64 = "0.22"
regex-lite = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
